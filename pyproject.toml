[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "atb-client"
dynamic = ["version"]
description = "Python client and CLI for the Automated Topology Builder (ATB) API v1"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
authors = [{ name = "ATB team, The University of Queensland" }]
keywords = ["molecular dynamics", "force field", "topology", "GROMOS", "ATB"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
test = ["pytest", "respx"]
dev = ["pytest", "respx", "ruff", "datamodel-code-generator[http]"]

[project.scripts]
atb = "atb_client.cli:main"

[project.urls]
Homepage = "https://atb.uq.edu.au"
Source = "https://github.com/ATB-UQ/atb_client"
Documentation = "https://atb.uq.edu.au/api/v1/docs"

[tool.hatch.version]
path = "src/atb_client/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/atb_client"]

[tool.hatch.build.targets.sdist]
include = ["src/atb_client", "tests", "scripts", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: hits the deployed API; needs ATB_LIVE_TESTS=1 and ATB_API_KEY"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["src/atb_client/generated/models.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["UP006", "UP007", "UP035", "UP045", "RUF012", "SIM105"]
