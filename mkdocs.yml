site_name: atb-client
site_description: Python client and CLI for the ATB API v1
site_url: https://atb-uq.github.io/atb_client/
repo_url: https://github.com/ATB-UQ/atb_client
repo_name: ATB-UQ/atb_client
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - tables

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            merge_init_into_class: true
            docstring_style: google
            show_signature_annotations: true
            separate_signature: true

nav:
  - Home: index.md
  - Usage guide: usage.md
  - HPC / workflow engines: hpc.md
  - CLI reference: cli.md
  - Errors: errors.md
  - API reference:
      - Client: reference/client.md
      - Resources: reference/resources.md
      - Models: reference/models.md
      - Exceptions: reference/exceptions.md
  - Migrating from atb_api: migrating.md
  - Admin: admin.md

watch:
  - src/atb_client
